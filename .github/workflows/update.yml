name: Update fuel prices

on:
  schedule:
    - cron: "*/15 * * * *"   # prices
    - cron: "3 4 * * *"      # stations and prices, once a day
  workflow_dispatch:
    inputs:
      stations:
        description: "Read the stations too (needed on the first run)"
        type: boolean
        default: true

# Fuel Finder allows one request at a time per client.
concurrency: fuel-finder

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch.mjs
        env:
          FF_CLIENT_ID: ${{ secrets.FF_CLIENT_ID }}
          FF_CLIENT_SECRET: ${{ secrets.FF_CLIENT_SECRET }}
          STATIONS: ${{ github.event.schedule == '3 4 * * *' || inputs.stations == true }}
      - run: npx wrangler d1 execute fuel-prices --remote --file updates.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
